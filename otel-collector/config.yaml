receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    storage: file_storage
    include_file_path: true
    operators:
      - type: container
        format: docker
        add_metadata_from_filepath: false
      - type: filter
        expr: 'attributes.attrs == nil || attributes.attrs["com.odoo.sfu.component"] != "server"'
      - type: remove
        field: attributes.attrs
      - &parse_sfu_json
        type: json_parser
        id: parse_sfu_json
        if: 'body matches "^\\s*\\{"'
        parse_to: attributes.sfu_event
        parse_ints: true
      # Keep raw bodies exact and resolve root-to-leaf spans into query metadata.
      - &resolve_sfu_fields
        type: add
        id: resolve_sfu_fields
        if: 'type(attributes.sfu_event) == "map" && type(attributes.sfu_event.fields) == "map" && type(attributes.sfu_event.spans) == "array"'
        field: attributes.sfu_fields
        # Signed overflow is omitted from metadata because the parser rounds it.
        value: >-
          EXPR(let metadata = ["timestamp", "level", "target", "service.name", "service.version", "service.instance.id", "deployment.environment", "trace_id"];
          let event = attributes.sfu_event;
          let pairs = concat(
            [["event", "runtime.log"]],
            filter(concat(
              reduce(event.spans, concat(#acc, toPairs(#.fields)), []),
              toPairs(event.fields)
            ), { !(#[0] in metadata) && !(#[0] in ["fields", "spans"]) }),
            filter(toPairs(event), { #[0] in metadata })
          );
          "{" + join(map(filter(toPairs(fromPairs(pairs)), {
            type(#[1]) != "float" || (#[1] > -9223372036854775808.0 && #[1] < 9223372036854775808.0)
          }), { toJSON(#[0]) + ":" + toJSON(#[1]) }), ",") + "}")
      - &parse_sfu_fields
        type: json_parser
        id: parse_sfu_fields
        if: 'attributes.sfu_fields != nil'
        parse_from: attributes.sfu_fields
        parse_to: attributes
        parse_ints: true
      - &remove_sfu_fields
        type: remove
        if: 'attributes.sfu_fields != nil'
        field: attributes.sfu_fields
      - &remove_sfu_event
        type: remove
        if: 'attributes.sfu_event != nil'
        field: attributes.sfu_event

  filelog/jsonl:
    include:
      - /var/log/o-sfu/*.jsonl
    start_at: end
    storage: file_storage
    include_file_path: true
    operators:
      - *parse_sfu_json
      - *resolve_sfu_fields
      - *parse_sfu_fields
      - *remove_sfu_fields
      - *remove_sfu_event

extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource/o-sfu-logs:
    attributes:
      - key: service.name
        value: o-sfu
        action: upsert
  batch:

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  extensions:
    - file_storage
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/tempo
    logs:
      receivers:
        - filelog/docker
        - filelog/jsonl
      processors:
        - memory_limiter
        - resource/o-sfu-logs
        - batch
      exporters:
        - otlphttp/loki

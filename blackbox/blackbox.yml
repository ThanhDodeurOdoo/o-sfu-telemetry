modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
  http_2xx_diagnostics:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      # Match the token used by the protected metrics scrape in both profiles.
      authorization:
        type: Bearer
        credentials_file: /run/secrets/o_sfu_diagnostics_token

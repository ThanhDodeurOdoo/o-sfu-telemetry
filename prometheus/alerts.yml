groups:
- name: o-sfu-phase-2
  rules:
  - alert: OSFUInstanceDown
    expr: osfu:metrics_available == 0
    for: 2m
    labels:
      severity: page
    annotations:
      summary: o-sfu metrics endpoint is unavailable
      description: Prometheus cannot scrape /metrics on the o-sfu target.
  - alert: OSFUNoopProbeFailed
    expr: osfu:noop_probe_status < 1
    for: 2m
    labels:
      severity: page
    annotations:
      summary: o-sfu noop probe is failing
      description: The noop probe for {{ $labels.instance }} failed or has no recent successful exporter scrape. Inspect probe status and freshness.
  - alert: OSFUDiagnosticsProbeFailed
    expr: osfu:diagnostics_probe_status < 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: o-sfu diagnostics probe is failing
      description: The diagnostics probe for {{ $labels.instance }} failed or has no recent successful exporter scrape. Inspect probe status and freshness.
  - alert: OSFUHandshakeRejectionSpike
    expr: (sum by (instance) (rate(osfu_ws_handshake_rejections_total[5m])) > 1) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: websocket handshake rejections are elevated
      description: Handshake rejections have stayed above 1 per second for 10 minutes.
  - alert: OSFUDisconnectChurn
    expr: (sum by (instance) (rate(osfu_transport_health_transitions_total{from="connected",to="disconnected"}[5m])) > 0.1) and on (instance) (osfu:metrics_available
      == 1)
    for: 10m
    labels:
      severity: page
    annotations:
      summary: transport disconnect churn is elevated
      description: Connected transports are transitioning to disconnected faster than the canary baseline.
  - alert: OSFURelayOverloadDrops
    expr: (osfu:relay_overload_rate_5m > 0) and on (instance) (osfu:metrics_available == 1)
    for: 5m
    labels:
      severity: page
    annotations:
      summary: relay overload drops detected
      description: Relay fan-out is dropping packets because bounded relay mailboxes report overloaded enqueue outcomes.
  - alert: OSFURoutingPressure
    expr: (sum by (instance) (rate(osfu_rtc_datagram_fallback_scans_total[5m])) > 0.5) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: datagram fallback scans are elevated
      description: Indexed datagram routing is missing often enough to trigger sustained fallback scans.
- name: o-sfu-phase-6
  rules:
  - alert: OSFUJoinSuccessRatioLow
    expr: (osfu:ws_join_success_ratio_5m < 0.9 and osfu:ws_join_attempts_rate_5m > 0.05) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: o-sfu join success ratio is degraded
      description: Accepted websocket joins are no longer progressing to joined users at the normal canary ratio.
  - alert: OSFUStartupFailuresSpike
    expr: (osfu:ws_startup_failures_rate_5m > 0.02) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: o-sfu startup failures are elevated
      description: Startup or user-initialize failures are rising before websocket users reach the steady-state loop.
  - alert: OSFUWebSocketOutboundQueueOverflow
    expr: (osfu:ws_outbound_queue_overflow_rate_5m > 0) and on (instance) (osfu:metrics_available == 1)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: o-sfu websocket slow-consumer shutdowns are occurring
      description: At least one websocket outbound room-event queue overflowed, so the runtime is closing lagging users instead of buffering unbounded fanout.
  - alert: OSFUTransportDisconnectRatePerUserHigh
    expr: (osfu:transport_disconnect_churn_per_user_5m > 0.05 and sum by (instance) (osfu_transport_users_active) > 0) and on (instance) (osfu:metrics_available ==
      1)
    for: 10m
    labels:
      severity: page
    annotations:
      summary: o-sfu transport churn is high relative to active users
      description: Connected transports are dropping often enough that the canary no longer looks stable even after normalizing by active users.
  - alert: OSFUTransportCleanupFailures
    expr: (osfu:transport_cleanup_unrecovered_failure_rate_5m > 0) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: o-sfu terminal transport cleanup failures are recurring
      description: Terminal transport cleanup failures have continued for 10 minutes. Inspect the structured teardown warnings and the session-close fallback.
  - alert: OSFUIceDtlsEstablishmentLow
    expr: (osfu:operator_boundary_status{boundary="ICE / DTLS events"} == 2) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: o-sfu transport establishment is degraded
      description: The recent DTLS event rate is low relative to joined events on {{ $labels.instance }} with at least 15 joined events in five minutes. This is an
        aggregate signal. Inspect session diagnostics before assigning a cause.
  - alert: OSFUJoinedWithoutDtlsGrowth
    expr: (osfu:join_dtls_event_gap_15m >= 1 and osfu:ws_joined_events_5m >= 15) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: joined and DTLS event counts differ
      description: Joined events exceed DTLS-connected events by at least one in the rolling 15-minute window on {{ $labels.instance }}. Events are not paired by session and this
        is not an affected-user count.
  - alert: OSFUMediaQualityRttHigh
    expr: (osfu:media_quality_peer_rtt_p95_5m > 0.75 and osfu:media_quality_peer_rtt_observations_5m > 0) and on (instance) (osfu:metrics_available == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: o-sfu sampled peer RTT is elevated
      description: Server-side sampled peer RTT p95 is above 750 ms while media-quality samples are present.
  - alert: OSFUMediaQualityLossHigh
    expr: ((osfu:media_quality_ingress_loss_ppm_average_5m > 50000) or (osfu:media_quality_egress_loss_ppm_average_5m > 50000)) and on (instance) (osfu:metrics_available
      == 1)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: o-sfu sampled media loss is elevated
      description: Server-side sampled ingress or egress packet loss is above 5 percent while media-quality samples are present.
  - alert: OSFUOutputBudgetSessionCloses
    expr: osfu:output_budget_session_closes_rate_5m > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: RTC output protection is closing sessions
      description: Output-budget exhaustion has closed sessions on {{ $labels.instance }}. Inspect the protective-limit counters and transport exit reasons.
  - alert: OSFURtcpIngressBudgetDrops
    expr: osfu:rtcp_ingress_budget_drops_rate_5m > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: RTCP ingress protection is dropping datagrams
      description: The per-session RTCP ingress byte budget is dropping candidate RTCP datagrams on {{ $labels.instance }}. Inspect sender behavior and transport
        load.

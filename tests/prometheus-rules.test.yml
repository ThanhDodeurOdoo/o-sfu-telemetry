      - series: osfu_ws_connections_total{instance="idle:8072",stage="credentials_received"}
        values: 0+0x5
      - series: osfu_ws_connections_total{instance="idle:8072",stage="joined"}
        values: 0+0x5
      - series: osfu_transport_dtls_connected_total{instance="idle:8072"}
        values: 0+0x5
      - series: osfu_rtp_packets_total{instance="idle:8072",direction="ingress"}
        values: 0+0x5
      - series: osfu_rtp_forwarded_packets_total{instance="idle:8072",destination="local_rtc"}
        values: 0+0x5
      - series: osfu_media_quality_loss_observations_total{instance="idle:8072",direction="ingress"}
        values: 0+0x5
      - series: osfu_media_quality_loss_ppm_observed_total{instance="idle:8072",direction="ingress"}
        values: 0+0x5
      - series: osfu_transport_user_lifetime_seconds_count{instance="idle:8072"}
        values: 0+0x5
      - series: osfu_transport_user_lifetime_seconds_bucket{instance="idle:8072",le="10"}
        values: 0+0x5
      - series: osfu_transport_user_lifetime_seconds_bucket{instance="idle:8072",le="60"}
        values: 0+0x5
      - series: osfu_rtc_rtcp_ingress_budget_drops_total{instance="idle:8072"}
        values: 0+0x5
      - series: osfu_rtc_output_budget_exhaustions_total{instance="idle:8072",limit="events"}
        values: 0+0x5
      - series: osfu_rtc_output_budget_session_closes_total{instance="idle:8072"}
        values: 0+0x5
      - series: up{job="o-sfu",instance="failed:8073"}
        values: '0x5'
      - series: up{job="o-sfu-noop",instance="failed:8073"}
        values: 1x5
      - series: probe_success{job="o-sfu-noop",instance="failed:8073"}

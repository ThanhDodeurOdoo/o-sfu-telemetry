rule_files:
  - ../prometheus/recording-rules.yml
  - ../prometheus/alerts.yml
  - ../prometheus/pipeline-alerts.yml
evaluation_interval: 1m
fuzzy_compare: true
group_eval_order:
  - o-sfu-derived
  - o-sfu-phase-2
  - o-sfu-phase-6
  - telemetry-pipeline
tests:
  - name: Independent instances preserve idle missing and failed evidence
    interval: 1m
    input_series:
      - series: up{job="o-sfu",instance="baseline:8070"}
        values: 1x5
      - series: up{job="o-sfu-noop",instance="baseline:8070"}
        values: 1x5
      - series: probe_success{job="o-sfu-noop",instance="baseline:8070"}
        values: 1x5
      - series: up{job="o-sfu-diagnostics",instance="baseline:8070"}
        values: 1x5
      - series: probe_success{job="o-sfu-diagnostics",instance="baseline:8070"}
        values: 1x5
      - series: osfu_users_active{instance="baseline:8070"}
        values: 10x5
      - series: osfu_ws_connections_total{instance="baseline:8070",stage="accepted"}
        values: 0+6x5
      - series: osfu_ws_connections_total{instance="baseline:8070",stage="credentials_received"}
        values: 0+6x5
      - series: osfu_ws_connections_total{instance="baseline:8070",stage="joined"}
        values: 0+6x5
      - series: osfu_transport_dtls_connected_total{instance="baseline:8070"}
        values: 0+6x5
      - series: osfu_rtp_packets_total{instance="baseline:8070",direction="ingress"}
        values: 0+6000x5
      - series: osfu_rtp_forwarded_packets_total{instance="baseline:8070",destination="local_rtc"}
        values: 0+18000x5
      - series: osfu_media_quality_loss_observations_total{instance="baseline:8070",direction="ingress"}
        values: 0+6x5
      - series: osfu_media_quality_loss_ppm_observed_total{instance="baseline:8070",direction="ingress"}
        values: 0+60000x5
      - series: osfu_transport_user_lifetime_seconds_count{instance="baseline:8070"}
        values: 0+20x5
      - series: osfu_transport_user_lifetime_seconds_bucket{instance="baseline:8070",le="10"}
        values: 0+4x5
      - series: osfu_transport_user_lifetime_seconds_bucket{instance="baseline:8070",le="60"}
        values: 0+8x5
      - series: osfu_rtc_rtcp_ingress_budget_drops_total{instance="baseline:8070"}
        values: 0+0x5
      - series: osfu_rtc_output_budget_exhaustions_total{instance="baseline:8070",limit="events"}
        values: 0+0x5
      - series: osfu_rtc_output_budget_session_closes_total{instance="baseline:8070"}
        values: 0+0x5
      - series: up{job="o-sfu",instance="candidate:8071"}
        values: 1x5
      - series: up{job="o-sfu-noop",instance="candidate:8071"}
        values: 1x5
      - series: probe_success{job="o-sfu-noop",instance="candidate:8071"}
        values: 1x5
      - series: up{job="o-sfu-diagnostics",instance="candidate:8071"}
        values: 1x5
      - series: probe_success{job="o-sfu-diagnostics",instance="candidate:8071"}
        values: 1x5
      - series: osfu_users_active{instance="candidate:8071"}
        values: 10x5
      - series: osfu_ws_connections_total{instance="candidate:8071",stage="accepted"}
        values: 0+6x5
      - series: osfu_ws_connections_total{instance="candidate:8071",stage="credentials_received"}
